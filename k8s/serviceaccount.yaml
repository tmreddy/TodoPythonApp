# The pod's AWS identity.
#
# The role-arn annotation is what makes IRSA work: EKS injects a signed token
# into pods using this ServiceAccount, and boto3 exchanges it for credentials
# scoped to this role. No access keys anywhere in the cluster.
#
# The namespace and name here MUST match the trust policy Terraform generated in
# terraform/irsa.tf (locals.k8s_namespace / locals.k8s_service_account). If they
# drift, the pod gets no credentials, boto3 silently falls back to the node role,
# and CloudWatch logging stops working with no error in the pod logs.
#
# The ACCOUNT_ID placeholder is substituted at deploy time by
# .github/workflows/cd.yml. Locally:
#   kubectl apply -f <(sed "s|ACCOUNT_ID|$(aws sts get-caller-identity --query Account --output text)|" k8s/serviceaccount.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-api
  namespace: todo
  labels:
    app.kubernetes.io/name: todo-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/todo-api-irsa-role

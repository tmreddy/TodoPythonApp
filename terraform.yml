# Infrastructure changes, kept separate from application deploys.
#
# Why this is not part of pipeline.yml: application code and infrastructure
# change at completely different rates and blast radii. A bad app deploy rolls
# back in seconds; a bad `terraform apply` can delete a database. So plans run
# automatically and are only ever APPLIED when you deliberately trigger it.
#
# On a pull request touching terraform/: runs fmt, validate and plan, then posts
# the plan as a PR comment for review.
# On main: plan only -- never an automatic apply.
# apply: manual, via "Run workflow".
# destroy: manual too, and it makes you type the word destroy -- that one is
# irreversible, so it is the one worth gating.

name: terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      # Only destroy needs this. apply is convergent -- running it twice does
      # nothing the first run did not already do, and a mistake is recoverable by
      # correcting the config and applying again. destroy is irreversible: it
      # deletes the database with skip_final_snapshot = true. So the typed
      # confirmation is required exactly where the damage is permanent, rather
      # than on every run where it is mostly a source of failed runs.
      confirm:
        description: 'Only for destroy: type "destroy" here to confirm. Leave empty for plan/apply.'
        required: false
        type: string

concurrency:
  # Never let two applies touch the same state at once. Without remote state
  # locking this is the only thing preventing state corruption.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  # Terraform is noisy about colour codes in CI logs otherwise.
  TF_CLI_ARGS: "-no-color"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # A missing secret becomes an empty string, which configure-aws-credentials
      # reports as "Could not load credentials from any providers". See the same
      # step in pipeline.yml for the full list of causes.
      - name: Check the AWS secrets are set
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
            echo "::error::AWS_ACCESS_KEY_ID and/or AWS_SECRET_ACCESS_KEY are not set."
            echo "Add them as REPOSITORY secrets (Secrets tab, not Variables):"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "Both secrets are present (${#KEY_ID} and ${#SECRET} characters; expected 20 and 40)."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the credentials work
        run: aws sts get-caller-identity

      # Fails the build on unformatted code. Cheap, and it keeps diffs about
      # substance rather than whitespace.
      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        # Continue on error so a failed plan still gets reported to the PR
        # instead of just showing a red X with the reason buried in logs.
        continue-on-error: true
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show tfplan > plan.txt

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try {
              plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            } catch {
              plan = 'Plan failed before producing output. See the job logs.';
            }

            // GitHub rejects comments over 65536 characters.
            const limit = 60000;
            const truncated = plan.length > limit;
            const body = [
              '## Terraform plan',
              `Outcome: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              truncated ? plan.slice(0, limit) + '\n\n... truncated, see job logs' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'

    # Add a required reviewer to this environment in repo settings to turn every
    # infrastructure change into an approval gate.
    environment:
      name: infrastructure

    steps:
      # Checkout MUST come before any `run` step. This workflow sets
      # defaults.run.working-directory: terraform, and GitHub applies that to
      # every run step including the first -- so a run step placed before
      # checkout fails with:
      #   An error occurred trying to start process '/usr/bin/bash' with working
      #   directory '/home/runner/work/TodoPythonApp/TodoPythonApp/terraform'.
      #   No such file or directory
      # because terraform/ does not exist in the workspace yet.
      - uses: actions/checkout@v4

      # Guards DESTROY only -- see the note on the `confirm` input above. This
      # step is skipped entirely for apply, so a forgotten confirm box can no
      # longer block provisioning.
      #
      # Values come in via env rather than being interpolated into the script,
      # so a quote or backtick in the box cannot break (or inject into) the shell.
      - name: Verify confirmation
        if: inputs.action == 'destroy'
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # Keep only letters and digits, then lowercase. Both expected values
          # ("apply", "destroy") are pure letters, so this is a safe
          # normalisation and it tolerates every realistic paste artefact: a
          # trailing space, "Apply", stray quotes, and -- the one that bites
          # when copying out of rendered documentation -- a non-breaking space
          # (U+00A0), which `tr -d '[:space:]'` does NOT remove because tr works
          # on bytes and U+00A0 is multi-byte UTF-8.
          #
          # The safety property is unchanged: you still have to type the word.
          # "apply" vs "destroy" still mismatches.
          norm() { printf '%s' "$1" | tr -cd '[:alnum:]' | tr '[:upper:]' '[:lower:]'; }

          if [ "$(norm "$CONFIRM")" != "$(norm "$ACTION")" ]; then
            echo "::error::Confirmation mismatch -- nothing was changed."
            echo
            echo "  action  = '${ACTION}'"
            echo "  confirm = '${CONFIRM}'"
            printf '  confirm as bytes: '; printf '%s' "$CONFIRM" | od -c | head -2
            echo
            if [ -z "$CONFIRM" ]; then
              echo "The confirm box was EMPTY. Two things cause that:"
              echo
              echo " 1. It is a separate text field BELOW the action dropdown and is"
              echo "    not filled in for you."
              echo " 2. You used 'Re-run jobs' on a previous run. Re-running replays"
              echo "    the ORIGINAL inputs and gives you no chance to change them,"
              echo "    so a run that failed here will keep failing here forever."
              echo "    Start a fresh run: Actions -> terraform -> Run workflow."
            fi
            echo "This destroys the database and all its data, so it is confirmed"
            echo "by hand on purpose. Type exactly this in the confirm box:"
            echo
            echo "    ${ACTION}"
            exit 1
          fi

          echo "Confirmed: ${ACTION}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Same guard as the plan job: an unset secret otherwise fails inside
      # configure-aws-credentials with a message about AWS providers.
      - name: Check the AWS secrets are set
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$SECRET" ]; then
            echo "::error::AWS_ACCESS_KEY_ID and/or AWS_SECRET_ACCESS_KEY are not set."
            echo "This job runs in the 'infrastructure' environment. Repository secrets"
            echo "are visible to it, so add them at the repository level:"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "Both secrets are present (${#KEY_ID} and ${#SECRET} characters; expected 20 and 40)."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify the credentials work
        run: aws sts get-caller-identity

      - name: Init
        run: terraform init -input=false

      # EKS cluster creation takes 10-15 minutes, and the node group another
      # 3-5 on top, so this job is slow by nature rather than by fault.
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      # MUST run before destroy. The Kubernetes Service of type LoadBalancer was
      # created by the cloud-controller-manager, NOT by Terraform, so Terraform
      # has no idea it exists. That load balancer owns network interfaces in the
      # subnets, and AWS refuses to delete a subnet (and therefore the VPC) while
      # an ENI is attached. Skipping this step is the classic way a destroy hangs
      # for 20 minutes and then fails with "DependencyViolation".
      - name: Delete Kubernetes resources first
        if: inputs.action == 'destroy'
        continue-on-error: true
        run: |
          set -uo pipefail
          cluster=$(terraform output -raw cluster_name 2>/dev/null || echo "")

          if [ -z "$cluster" ]; then
            echo "No cluster in state; nothing to clean up."
            exit 0
          fi

          if ! aws eks describe-cluster --name "$cluster" >/dev/null 2>&1; then
            echo "Cluster $cluster already gone."
            exit 0
          fi

          aws eks update-kubeconfig --region "$AWS_REGION" --name "$cluster"

          # Deleting the Service triggers deletion of the load balancer and its
          # ENIs. --wait makes kubectl block until the finalizer completes.
          echo "Deleting Service (releases the load balancer)..."
          kubectl delete svc todo-api -n todo --ignore-not-found --wait --timeout=5m || true

          echo "Deleting the rest of the namespace..."
          kubectl delete namespace todo --ignore-not-found --wait --timeout=5m || true

          # ENI detachment lags the API call, so give AWS a moment to finish.
          echo "Waiting for load balancer network interfaces to clear..."
          sleep 45

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -lock-timeout=5m

      - name: Outputs
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Terraform outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# Infrastructure changes, kept separate from application deploys.
#
# Why this is not part of pipeline.yml: application code and infrastructure
# change at completely different rates and blast radii. A bad app deploy rolls
# back in seconds; a bad `terraform apply` can delete a database. So plans run
# automatically and are only ever APPLIED when you deliberately trigger it.
#
# On a pull request touching terraform/: runs fmt, validate and plan, then posts
# the plan as a PR comment for review.
# On main: plan only -- never an automatic apply.
# apply: manual, via "Run workflow", and it makes you type the word apply.

name: terraform

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm:
        description: 'Type "apply" or "destroy" to confirm a state-changing run'
        required: false
        type: string

concurrency:
  # Never let two applies touch the same state at once. Without remote state
  # locking this is the only thing preventing state corruption.
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  # Terraform is noisy about colour codes in CI logs otherwise.
  TF_CLI_ARGS: "-no-color"

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Fails the build on unformatted code. Cheap, and it keeps diffs about
      # substance rather than whitespace.
      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        # Continue on error so a failed plan still gets reported to the PR
        # instead of just showing a red X with the reason buried in logs.
        continue-on-error: true
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform show tfplan > plan.txt

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = '';
            try {
              plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            } catch {
              plan = 'Plan failed before producing output. See the job logs.';
            }

            // GitHub rejects comments over 65536 characters.
            const limit = 60000;
            const truncated = plan.length > limit;
            const body = [
              '## Terraform plan',
              `Outcome: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              truncated ? plan.slice(0, limit) + '\n\n... truncated, see job logs' : plan,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'

    # Add a required reviewer to this environment in repo settings to turn every
    # infrastructure change into an approval gate.
    environment:
      name: infrastructure

    steps:
      # A typo in the confirm box should stop the run before it touches AWS,
      # not after.
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.action }}" ]; then
            echo "Confirmation mismatch."
            echo "To ${{ inputs.action }}, type '${{ inputs.action }}' in the confirm box."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      # EKS cluster creation takes 10-15 minutes, and the node group another
      # 3-5 on top, so this job is slow by nature rather than by fault.
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m

      # MUST run before destroy. The Kubernetes Service of type LoadBalancer was
      # created by the cloud-controller-manager, NOT by Terraform, so Terraform
      # has no idea it exists. That load balancer owns network interfaces in the
      # subnets, and AWS refuses to delete a subnet (and therefore the VPC) while
      # an ENI is attached. Skipping this step is the classic way a destroy hangs
      # for 20 minutes and then fails with "DependencyViolation".
      - name: Delete Kubernetes resources first
        if: inputs.action == 'destroy'
        continue-on-error: true
        run: |
          set -uo pipefail
          cluster=$(terraform output -raw cluster_name 2>/dev/null || echo "")

          if [ -z "$cluster" ]; then
            echo "No cluster in state; nothing to clean up."
            exit 0
          fi

          if ! aws eks describe-cluster --name "$cluster" >/dev/null 2>&1; then
            echo "Cluster $cluster already gone."
            exit 0
          fi

          aws eks update-kubeconfig --region "$AWS_REGION" --name "$cluster"

          # Deleting the Service triggers deletion of the load balancer and its
          # ENIs. --wait makes kubectl block until the finalizer completes.
          echo "Deleting Service (releases the load balancer)..."
          kubectl delete svc todo-api -n todo --ignore-not-found --wait --timeout=5m || true

          echo "Deleting the rest of the namespace..."
          kubectl delete namespace todo --ignore-not-found --wait --timeout=5m || true

          # ENI detachment lags the API call, so give AWS a moment to finish.
          echo "Waiting for load balancer network interfaces to clear..."
          sleep 45

      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve -lock-timeout=5m

      - name: Outputs
        if: inputs.action == 'apply'
        run: |
          {
            echo "### Terraform outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
